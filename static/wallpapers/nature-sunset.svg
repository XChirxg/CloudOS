<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1920 1080" width="100%" height="100%">
  <defs>
    <linearGradient id="sky" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#0f172a" />
      <stop offset="45%" stop-color="#312e81" />
      <stop offset="70%" stop-color="#7c2d12" />
      <stop offset="90%" stop-color="#d97706" />
      <stop offset="100%" stop-color="#f59e0b" />
    </linearGradient>
    <radialGradient id="sun" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#fef08a" />
      <stop offset="40%" stop-color="#f59e0b" stop-opacity="0.8" />
      <stop offset="100%" stop-color="#b45309" stop-opacity="0" />
    </radialGradient>
    <filter id="sunblur">
      <feGaussianBlur stdDeviation="30" />
    </filter>
  </defs>
  <rect width="1920" height="1080" fill="url(#sky)" />
  <circle cx="960" cy="720" r="160" fill="url(#sun)" filter="url(#sunblur)" />
  <circle cx="960" cy="720" r="100" fill="#fef08a" opacity="0.9" />
  <!-- Back mountains -->
  <path d="M 0,1080 L 0,820 L 320,680 L 640,760 L 980,620 L 1320,740 L 1650,650 L 1920,780 L 1920,1080 Z" fill="#1e1b4b" opacity="0.8" />
  <!-- Mid mountains -->
  <path d="M 0,1080 L 0,890 L 250,780 L 580,870 L 920,730 L 1240,840 L 1580,750 L 1920,860 L 1920,1080 Z" fill="#0f172a" opacity="0.9" />
  <!-- Fore mountains -->
  <path d="M 0,1080 L 0,960 L 380,880 L 760,950 L 1150,860 L 1520,930 L 1920,890 L 1920,1080 Z" fill="#030712" />
</svg>
