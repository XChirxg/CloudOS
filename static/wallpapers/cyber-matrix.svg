<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1920 1080" width="100%" height="100%">
  <defs>
    <linearGradient id="cyberbg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#050508" />
      <stop offset="50%" stop-color="#0a0f1d" />
      <stop offset="100%" stop-color="#020307" />
    </linearGradient>
    <linearGradient id="cyanPurple" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00f2fe" stop-opacity="0.8" />
      <stop offset="100%" stop-color="#4facfe" stop-opacity="0.2" />
    </linearGradient>
    <linearGradient id="neonPink" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#f857a6" stop-opacity="0.7" />
      <stop offset="100%" stop-color="#ff5858" stop-opacity="0.1" />
    </linearGradient>
    <filter id="cblur" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="80" />
    </filter>
  </defs>
  <rect width="1920" height="1080" fill="url(#cyberbg)" />
  <circle cx="400" cy="300" r="450" fill="url(#cyanPurple)" filter="url(#cblur)" />
  <circle cx="1500" cy="700" r="500" fill="url(#neonPink)" filter="url(#cblur)" />
  <circle cx="1000" cy="900" r="350" fill="#7928ca" opacity="0.4" filter="url(#cblur)" />
  <!-- Grid lines -->
  <g stroke="#ffffff" stroke-width="0.5" opacity="0.07">
    <line x1="0" y1="180" x2="1920" y2="180" /><line x1="0" y1="360" x2="1920" y2="360" />
    <line x1="0" y1="540" x2="1920" y2="540" /><line x1="0" y1="720" x2="1920" y2="720" />
    <line x1="0" y1="900" x2="1920" y2="900" />
    <line x1="320" y1="0" x2="320" y2="1080" /><line x1="640" y1="0" x2="640" y2="1080" />
    <line x1="960" y1="0" x2="960" y2="1080" /><line x1="1280" y1="0" x2="1280" y2="1080" />
    <line x1="1600" y1="0" x2="1600" y2="1080" />
  </g>
</svg>
