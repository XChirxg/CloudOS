<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>File Explorer</title>
<style>
:root{
  --bg:#1f1f1f; --sidebar:#242424; --surface:#2a2a2a; --surface2:#313131;
  --border:#3a3a3a; --text:#f1f1f1; --muted:#9d9d9d; --accent:#4cc2ff;
  --accent-soft:rgba(76,194,255,.16); --hover:#343434; --active:#3a3a3a;
  --danger:#ff6b6b; --radius:8px;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{height:100%}
body{margin:0;background:var(--bg);color:var(--text);font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Arial,sans-serif;font-size:13px;overflow:hidden;user-select:none}
button,input,select{font:inherit;color:inherit}
input,select{-webkit-user-select:auto;user-select:auto}
svg{display:block}
.app{display:flex;height:100vh;height:100dvh}

/* ---- sidebar ---- */
.sidebar{width:220px;flex:0 0 220px;background:var(--sidebar);border-right:1px solid var(--border);
  overflow-y:auto;padding:8px 6px;transition:transform .18s ease;z-index:40}
.sidebar h4{margin:10px 8px 4px;font-size:11px;font-weight:600;color:var(--muted);text-transform:uppercase;letter-spacing:.04em}
.side-item{display:flex;align-items:center;gap:10px;padding:7px 8px;border-radius:6px;cursor:pointer;color:var(--text);white-space:nowrap}
.side-item svg{flex:0 0 18px;width:18px;height:18px}
.side-item span{overflow:hidden;text-overflow:ellipsis}
.side-item:hover{background:var(--hover)}
.side-item.active{background:var(--accent-soft);color:var(--accent)}
.side-item.active svg{color:var(--accent)}
.scrim{display:none}

/* ---- main ---- */
.main{flex:1;display:flex;flex-direction:column;min-width:0}
.topbar{background:var(--surface);border-bottom:1px solid var(--border);padding:6px 8px;
  display:flex;align-items:center;gap:4px;flex-wrap:wrap}
.ibtn{width:32px;height:32px;flex:0 0 32px;border:none;background:transparent;border-radius:6px;
  display:flex;align-items:center;justify-content:center;cursor:pointer;color:var(--text)}
.ibtn svg{width:17px;height:17px}
.ibtn:hover{background:var(--hover)}
.ibtn:disabled{opacity:.3;cursor:default}
.ibtn:disabled:hover{background:transparent}
.crumbs{flex:1;min-width:80px;display:flex;align-items:center;gap:2px;overflow-x:auto;
  padding:0 6px;background:var(--surface2);border:1px solid var(--border);border-radius:6px;height:32px;scrollbar-width:none}
.crumbs::-webkit-scrollbar{display:none}
.crumb{white-space:nowrap;padding:4px 6px;border-radius:4px;cursor:pointer;color:var(--text)}
.crumb:hover{background:var(--hover)}
.crumb.sep{color:var(--muted);padding:0 1px;cursor:default}
.crumb.sep:hover{background:transparent}
.search-wrap{position:relative;display:flex;align-items:center}
.search{width:150px;height:32px;background:var(--surface2);border:1px solid var(--border);
  border-radius:6px;padding:0 10px 0 30px;outline:none}
.search:focus{border-color:var(--accent)}
.search-wrap svg{position:absolute;left:8px;width:15px;height:15px;color:var(--muted);pointer-events:none}
.viewsel{height:32px;background:var(--surface2);border:1px solid var(--border);border-radius:6px;
  padding:0 6px;outline:none}
.hidden{display:none !important}

/* ---- content ---- */
.content{flex:1;overflow-y:auto;padding:10px}
.status{padding:8px 4px;color:var(--muted);font-size:12px}
.empty{text-align:center;color:var(--muted);padding:70px 10px;font-size:13px}
.empty svg{width:46px;height:46px;color:var(--muted);margin:0 auto 10px;opacity:.5}

/* grid view */
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(108px,1fr));gap:3px}
.gitem{display:flex;flex-direction:column;align-items:center;gap:5px;padding:10px 4px;border-radius:6px;cursor:pointer;text-align:center}
.gitem:hover{background:var(--hover)}
.gitem.selected{background:var(--accent-soft)}
.gitem .ic{width:52px;height:52px}
.gitem .nm{font-size:12px;line-height:1.25;max-width:100%;overflow:hidden;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;word-break:break-word}
.gitem img.thumb{width:52px;height:52px;object-fit:cover;border-radius:5px;border:1px solid var(--border)}

/* list view */
.list{width:100%;border-collapse:collapse}
.list .lhead{display:grid;grid-template-columns:1fr 130px 90px 90px;padding:6px 10px;color:var(--muted);font-size:11px;border-bottom:1px solid var(--border);position:sticky;top:-10px;background:var(--bg)}
.litem{display:grid;grid-template-columns:1fr 130px 90px 90px;align-items:center;padding:6px 10px;border-radius:6px;cursor:pointer;gap:6px}
.litem:hover{background:var(--hover)}
.litem.selected{background:var(--accent-soft)}
.litem .nm{display:flex;align-items:center;gap:9px;overflow:hidden}
.litem .nm .ic{width:20px;height:20px;flex:0 0 20px}
.litem .nm span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.litem .col{color:var(--muted);font-size:12px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}

/* context menu */
.menu{position:fixed;z-index:100;background:var(--surface2);border:1px solid var(--border);
  border-radius:8px;box-shadow:0 12px 30px rgba(0,0,0,.45);min-width:170px;padding:4px;display:none}
.menu button{display:flex;align-items:center;gap:10px;width:100%;border:0;background:transparent;
  text-align:left;padding:8px 10px;border-radius:5px;cursor:pointer;color:var(--text)}
.menu button svg{width:16px;height:16px;color:var(--muted)}
.menu button:hover{background:var(--hover)}
.menu button.danger{color:var(--danger)}
.menu button.danger svg{color:var(--danger)}
.menu hr{border:none;border-top:1px solid var(--border);margin:4px 2px}

/* upload progress toast */
.toast{position:fixed;bottom:16px;left:50%;transform:translateX(-50%);background:var(--surface2);
  border:1px solid var(--border);color:var(--text);padding:9px 16px;border-radius:8px;font-size:12.5px;
  box-shadow:0 8px 24px rgba(0,0,0,.4);z-index:200;display:none}

@media(max-width:760px){
  .sidebar{position:fixed;left:0;top:0;bottom:0;transform:translateX(-100%);box-shadow:0 0 30px rgba(0,0,0,.5)}
  .sidebar.open{transform:translateX(0)}
  .scrim.show{display:block;position:fixed;inset:0;background:rgba(0,0,0,.5);z-index:35}
  .search{width:110px}
  .content{padding:8px}
  .grid{grid-template-columns:repeat(auto-fill,minmax(88px,1fr))}
  .lhead .col:nth-child(3),.litem .col:nth-child(3){display:none}
  .list .lhead,.litem{grid-template-columns:1fr 100px 90px}
}
</style>
</head>
<body>
<div class="app">
  <div class="scrim" id="scrim" onclick="closeSidebar()"></div>
  <nav class="sidebar" id="sidebar"></nav>

  <div class="main">
    <div class="topbar">
      <button class="ibtn" id="menuBtn" onclick="toggleSidebar()" title="Menu"></button>
      <button class="ibtn" id="backBtn" onclick="history.back()" title="Back"></button>
      <button class="ibtn" id="fwdBtn" onclick="history.forward()" title="Forward"></button>
      <button class="ibtn" id="upBtn" onclick="goUp()" title="Up"></button>
      <div class="crumbs" id="crumbs"></div>
      <div class="search-wrap" id="searchWrap">
        <input class="search" id="search" placeholder="Search" oninput="render()">
      </div>
      <select class="viewsel" id="viewsel" onchange="setView(this.value)">
        <option value="grid">Large icons</option>
        <option value="list">Details</option>
      </select>
      <select class="viewsel" id="sortsel" onchange="render()">
        <option value="name-asc">Name A–Z</option>
        <option value="name-desc">Name Z–A</option>
        <option value="date-desc">Newest first</option>
        <option value="date-asc">Oldest first</option>
        <option value="size-desc">Largest first</option>
        <option value="size-asc">Smallest first</option>
        <option value="type-asc">Type</option>
      </select>
      <input type="file" id="fileInput" multiple class="hidden" onchange="doUpload(this.files)">
      <button class="ibtn" id="uploadBtn" onclick="document.getElementById('fileInput').click()" title="Upload here"></button>
      <button class="ibtn" id="refreshBtn" onclick="load()" title="Refresh"></button>
    </div>
    <div class="content" id="content"></div>
  </div>
</div>

<div class="menu" id="ctxMenu"></div>
<div class="toast" id="toast"></div>

const IMG=/\.(jpg|jpeg|png|gif|webp|bmp|svg|avif|heic|heif)$/i;
const VID=/\.(mp4|webm|mov|m4v|mkv|avi)$/i;
const AUD=/\.(mp3|wav|m4a|ogg|flac|aac)$/i;
const TXT=/\.(txt|md|log|yaml|yml|ini|cfg|conf)$/i;
const CODE=/\.(json|js|ts|jsx|tsx|py|sh|c|cpp|h|java|go|rs|css|html|xml|csv)$/i;
const ARC=/\.(zip|tar|gz|rar|7z|bz2)$/i;
const PDF=/\.pdf$/i;
const DOCX=/\.(doc|docx|odt)$/i;
const XLSX=/\.(xls|xlsx|ods)$/i;
const PPTX=/\.(ppt|pptx|odp)$/i;

function fileIconKey(name){
  if(IMG.test(name))return'image';
  if(PDF.test(name))return'pdf';
  if(VID.test(name))return'video';
  if(AUD.test(name))return'audio';
  if(ARC.test(name))return'archive';
  if(DOCX.test(name))return'word';
  if(XLSX.test(name))return'excel';
  if(PPTX.test(name))return'ppt';
  if(CODE.test(name))return'code';
  if(TXT.test(name))return'text';
  return'generic';
}
function esc(s){return s.replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));}
function fmtSize(n){if(n==null)return'';let u=['B','KB','MB','GB','TB'],i=0;while(n>=1024&&i<4){n/=1024;i++}return`${n.toFixed(i?1:0)} ${u[i]}`;}
function fmtDate(t){if(!t)return'';const d=new Date(t*1000);const pad=x=>String(x).padStart(2,'0');
  return`${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())} ${pad(d.getHours())}:${pad(d.getMinutes())}`;}

/* ---------------- state ---------------- */
let shares=[];
let state={share:'',path:''};
let items=[];
let view=localStorage.getItem('fx_view')||'grid';
let sort=localStorage.getItem('fx_sort')||'name-asc';
let selected=null, suppressClick=false;

document.getElementById('viewsel').value=view;
document.getElementById('sortsel').value=sort;

function dlUrl(p,force){return'/download?share='+encodeURIComponent(state.share)+'&path='+encodeURIComponent(p)+(force?'&dl=1':'');}

async function loadShares(){
  const r=await fetch('/api/shares',{cache:'no-store'});
  shares=await r.json();
  buildSidebar();
}
const SIDE_ICON={Home:'home',Desktop:'desktop',Downloads:'down',Documents:'docs',Pictures:'pics',Videos:'vids',Music:'music',Computer:'computer'};
function buildSidebar(){
  const nav=document.getElementById('sidebar');
  let h='<h4>Quick access</h4>';
  for(const s of shares.filter(s=>!s.root)){
    h+=`<div class="side-item" data-share="${esc(s.name)}" onclick="openShare('${esc(s.name)}')">${I[SIDE_ICON[s.name]||'folderplain']}<span>${esc(s.name)}</span></div>`;
  }
  const comp=shares.find(s=>s.root);
  if(comp){h+='<h4>This device</h4>';
    h+=`<div class="side-item" data-share="${esc(comp.name)}" onclick="openShare('${esc(comp.name)}')">${I.computer}<span>${esc(comp.name)}</span></div>`;}
  nav.innerHTML=h;
  markActiveSide();
}
function markActiveSide(){
  document.querySelectorAll('.side-item').forEach(el=>el.classList.toggle('active',el.dataset.share===state.share&&state.path===''));
}
function openShare(name){navigate(name,'');closeSidebar();}

function toggleSidebar(){document.getElementById('sidebar').classList.toggle('open');document.getElementById('scrim').classList.toggle('show');}
function closeSidebar(){document.getElementById('sidebar').classList.remove('open');document.getElementById('scrim').classList.remove('show');}

/* ---------------- navigation / history ---------------- */
function navigate(share,path,push=true){
  state={share,path};
  if(push){
    history.pushState(state,'','#'+encodeURIComponent(share)+'/'+encodeURIComponent(path));
  }
  load();
}
window.addEventListener('popstate',e=>{
  if(e.state){state=e.state;} else {state=parseHash();}
  load();
});
function parseHash(){
  const h=decodeURIComponent(location.hash.replace(/^#/,''));
  const i=h.indexOf('/');
  if(i<0) return null;
  return {share:h.slice(0,i),path:h.slice(i+1)};
}
function goUp(){
  if(!state.path){return;}
  const parent=state.path.split('/').slice(0,-1).join('/');
  navigate(state.share,parent);
}

/* ---------------- data ---------------- */
async function load(){
  markActiveSide();
  buildCrumbs();
  document.getElementById('upBtn').disabled=!state.path;
  const c=document.getElementById('content');
  c.innerHTML='<div class="status">Loading…</div>';
  try{
    const r=await fetch('/api/list?share='+encodeURIComponent(state.share)+'&path='+encodeURIComponent(state.path),{cache:'no-store'});
    if(!r.ok){c.innerHTML=`<div class="empty">${esc(await r.text())}</div>`;return;}
    items=await r.json();
    render();
  }catch(e){c.innerHTML='<div class="empty">Could not reach the server.</div>';}
}
function buildCrumbs(){
  const el=document.getElementById('crumbs');
  const parts=state.path?state.path.split('/'):[];
  let h=`<span class="crumb" onclick="navigate('${esc(state.share)}','')">${esc(state.share)}</span>`;
  let acc='';
  for(const p of parts){
    acc=acc?acc+'/'+p:p;
    h+=`<span class="crumb sep">›</span><span class="crumb" onclick="navigate('${esc(state.share)}','${esc(acc)}')">${esc(p)}</span>`;
  }
  el.innerHTML=h;
  el.scrollLeft=el.scrollWidth;
}
function setView(v){view=v;localStorage.setItem('fx_view',v);render();}

/* ---------------- render ---------------- */
function render(){
  sort=document.getElementById('sortsel').value;localStorage.setItem('fx_sort',sort);
  const q=document.getElementById('search').value.toLowerCase();
  let a=items.filter(x=>x.name.toLowerCase().includes(q));
  const [field,dir]=sort.split('-');
  a.sort((x,y)=>{
    let r=0;
    if(field==='name')r=x.name.localeCompare(y.name,undefined,{numeric:true,sensitivity:'base'});
    else if(field==='size')r=(x.size??-1)-(y.size??-1);
    else if(field==='date')r=(x.mtime??0)-(y.mtime??0);
    else if(field==='type')r=(x.directory===y.directory?0:(x.directory?-1:1))||fileIconKey(x.name).localeCompare(fileIconKey(y.name));
    return dir==='desc'?-r:r;
  });
  a.sort((x,y)=>Number(y.directory)-Number(x.directory));
  const c=document.getElementById('content');
  if(!a.length){c.innerHTML='<div class="empty">'+I.folderplain.replace('currentColor','#666')+'<div>This folder is empty.</div></div>';return;}
  c.innerHTML='';
  if(view==='grid'){
    const g=document.createElement('div');g.className='grid';
    for(const f of a)g.appendChild(gridItem(f));
    c.appendChild(g);
  }else{
    const wrap=document.createElement('div');wrap.className='list';
    wrap.innerHTML='<div class="lhead"><div>Name</div><div class="col">Date modified</div><div class="col">Type</div><div class="col">Size</div></div>';
    for(const f of a)wrap.appendChild(listItem(f));
    c.appendChild(wrap);
  }
}
function iconFor(f){
  if(f.directory)return I.folder;
  return I[fileIconKey(f.name)]||I.generic;
}
function gridItem(f){
  const d=document.createElement('div');d.className='gitem';d.dataset.path=f.path;d.dataset.dir=f.directory?'1':'';
  let icHtml;
  if(!f.directory&&IMG.test(f.name)) icHtml=`<img class="thumb" loading="lazy" src="${dlUrl(f.path)}">`;
  else icHtml=`<div class="ic">${iconFor(f)}</div>`;
  d.innerHTML=`${icHtml}<div class="nm">${esc(f.name)}</div>`;
  attachHandlers(d,f);
  return d;
}
function listItem(f){
  const d=document.createElement('div');d.className='litem';d.dataset.path=f.path;d.dataset.dir=f.directory?'1':'';
  d.innerHTML=`<div class="nm"><span class="ic">${iconFor(f)}</span><span>${esc(f.name)}</span></div>
    <div class="col">${fmtDate(f.mtime)}</div>
    <div class="col">${f.directory?'Folder':fileIconKey(f.name).toUpperCase()}</div>
    <div class="col">${f.directory?'':fmtSize(f.size)}</div>`;
  attachHandlers(d,f);
  return d;
}

/* ---------------- interaction: click / long-press / context menu ---------------- */
function attachHandlers(el,f){
  let timer=null,moved=false,sx=0,sy=0;
  el.addEventListener('click',e=>{
    if(suppressClick){suppressClick=false;return;}
    activate(f);
  });
  el.addEventListener('contextmenu',e=>{e.preventDefault();openMenu(e.clientX,e.clientY,f);});
  el.addEventListener('touchstart',e=>{
    moved=false;const t=e.touches[0];sx=t.clientX;sy=t.clientY;
    timer=setTimeout(()=>{
      if(!moved){suppressClick=true;navigator.vibrate&&navigator.vibrate(12);openMenu(sx,sy,f);}
    },500);
  },{passive:true});
  el.addEventListener('touchmove',e=>{
    const t=e.touches[0];if(Math.abs(t.clientX-sx)>10||Math.abs(t.clientY-sy)>10){moved=true;clearTimeout(timer);}
  },{passive:true});
  el.addEventListener('touchend',()=>clearTimeout(timer));
}
function activate(f){
  if(f.directory){navigate(state.share,f.path);}
  else{window.open(dlUrl(f.path),'_blank');}
}
function openMenu(x,y,f){
  selected=f;
  const m=document.getElementById('ctxMenu');
  let h='';
  h+=`<button onclick="menuAct('open')">${I.open}${f.directory?'Open':'Open in new tab'}</button>`;
  if(!f.directory) h+=`<button onclick="menuAct('dl')">${I.dl}Download</button>`;
  h+='<hr>';
  h+=`<button onclick="menuAct('ren')">${I.rename}Rename</button>`;
  h+=`<button class="danger" onclick="menuAct('del')">${I.trash}Delete</button>`;
  m.innerHTML=h;
  const vw=innerWidth,vh=innerHeight;
  m.style.display='block';
  const mw=m.offsetWidth,mh=m.offsetHeight;
  m.style.left=Math.min(x,vw-mw-8)+'px';
  m.style.top=Math.min(y,vh-mh-8)+'px';
}
function closeMenu(){document.getElementById('ctxMenu').style.display='none';}
document.addEventListener('click',e=>{if(!e.target.closest('#ctxMenu'))closeMenu();});
document.addEventListener('scroll',closeMenu,true);
function menuAct(action){
  const f=selected;closeMenu();if(!f)return;
  if(action==='open')activate(f);
  else if(action==='dl')window.open(dlUrl(f.path,true),'_blank');
  else if(action==='ren')doRename(f);
  else if(action==='del')doDelete(f);
}
function doRename(f){
  const n=prompt('New name:',f.name);
  if(n==null||!n.trim()||n===f.name)return;
  fetch('/api/rename',{method:'POST',headers:{'Content-Type':'application/json'},
    body:JSON.stringify({share:state.share,path:f.path,new_name:n.trim()})})
    .then(async r=>{if(!r.ok)alert(await r.text());else load();});
}
function doDelete(f){
  if(!confirm(`Delete "${f.name}"?${f.directory?' This deletes the folder and everything inside it.':''}`))return;
  fetch('/api/delete',{method:'POST',headers:{'Content-Type':'application/json'},
    body:JSON.stringify({share:state.share,path:f.path})})
    .then(async r=>{if(!r.ok)alert(await r.text());else load();});
}
function showToast(t){const el=document.getElementById('toast');el.textContent=t;el.style.display='block';clearTimeout(showToast._t);showToast._t=setTimeout(()=>el.style.display='none',2600);}
async function doUpload(files){
  if(!files.length)return;
  const fd=new FormData();for(const f of files)fd.append('files',f,f.name);
  showToast('Uploading '+files.length+' file(s)…');
  try{
    const r=await fetch('/upload?share='+encodeURIComponent(state.share)+'&path='+encodeURIComponent(state.path),{method:'POST',body:fd});
    const d=await r.json();
    showToast(d.ok?`Uploaded ${d.count} file(s).`:(d.error||'Upload failed.'));
    load();
  }catch(e){showToast('Upload failed.');}
  document.getElementById('fileInput').value='';
}

/* ---------------- boot ---------------- */
(async function(){
  await loadShares();
  const fromHash=parseHash();
  const initial=fromHash||{share:(shares[0]?shares[0].name:''),path:''};
  state=initial;
  history.replaceState(state,'','#'+encodeURIComponent(state.share)+'/'+encodeURIComponent(state.path));
  load();
})();
</script>
</body>
