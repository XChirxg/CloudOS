async function promptWallpaperUrl() {
  const url = prompt('Enter image URL (http or https):');
  if (!url || !url.trim()) return;
  showToast('Downloading image to server...');
  try {
    const res = await fetch('/api/wallpaper/download_url', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ url: url.trim() })
    });
    const d = await res.json();
    if (d.ok && d.url) {
      setWallpaper(d.url);
      showToast('Wallpaper applied!');
    } else {
      showToast('Failed: ' + (d.error || 'Could not download image'));
    }
  } catch (err) {
    showToast('Download error: ' + err.message);
  }
}

function handleCustomWallpaperUpload(files) {
  if (!files || !files.length) return;
  const fd = new FormData();
  fd.append('file', files[0]);
  showToast('Uploading custom wallpaper...');
  fetch('/upload/wallpaper', { method: 'POST', body: fd })
    .then(r => r.json())
    .then(d => {
      if (d.ok && d.url) {
        setWallpaper(d.url);
        showToast('Wallpaper applied!');
      } else {
        showToast('Upload failed: ' + (d.error || 'Unknown error'));
      }
    })
    .catch(err => {
      showToast('Upload error: ' + err.message);
    });
}

function setWallpaper(url, syncServer = true) {
  LiveSpaceWallpaper.stop();
  currentWallpaper = url;
  localStorage.setItem('win_wallpaper', url);
  const dEl = document.getElementById('desktop');
  if (dEl) {
    dEl.style.backgroundColor = 'transparent';
    dEl.style.backgroundImage = `url("${url}")`;
  }
  if (syncServer) {
    syncSessionState({ wallpaper: url, is_live_wallpaper: false });
  }
}

function toggleLiveSpaceWallpaper(enable, syncServer = true) {
  if (enable) {
    LiveSpaceWallpaper.start();
    if (syncServer) {
      syncSessionState({ is_live_wallpaper: true });
    }
  } else {
    LiveSpaceWallpaper.stop();
    setWallpaper(currentWallpaper, syncServer);
  }
}

/* ================= LIVE SPACE WALLPAPER ================= */
const LiveSpaceWallpaper = {
  canvas: null,
  ctx: null,
  active: false,
  stars: [],
  meteors: [],
  animId: null,
  lastMeteorTime: 0,

  init() {
    this.canvas = document.getElementById('live-space-canvas');
    if (!this.canvas) return;
    this.ctx = this.canvas.getContext('2d');
    this.resize();
    window.addEventListener('resize', () => this.resize(), { passive: true });
    document.addEventListener('visibilitychange', () => {
      if (document.hidden) {
        if (this.animId) cancelAnimationFrame(this.animId);
      } else if (this.active) {
        this.animate();
      }
    });
  },

  resize() {
    if (!this.canvas) return;
    this.canvas.width = window.innerWidth;
    this.canvas.height = window.innerHeight;
    this.createStars();
  },

  createStars() {
    const w = this.canvas.width || window.innerWidth;
    const h = this.canvas.height || window.innerHeight;
    const count = Math.min(320, Math.floor((w * h) / 4500) + 120);
    this.stars = [];
    const colors = ['#ffffff', '#ffffff', '#e0f2fe', '#bae6fd', '#fef08a', '#e9d5ff'];

    for (let i = 0; i < count; i++) {
      this.stars.push({
        x: Math.random() * w,
        y: Math.random() * h,
        radius: Math.random() * 1.8 + 0.5,
        speedX: (Math.random() - 0.5) * 0.16 + 0.05,
        speedY: (Math.random() - 0.5) * 0.12 + 0.03,
        alpha: Math.random() * 0.7 + 0.3,
        twinkleSpeed: Math.random() * 0.03 + 0.015,
        twinklePhase: Math.random() * Math.PI * 2,
        color: colors[Math.floor(Math.random() * colors.length)]
      });
    }
  },

  start() {
    this.active = true;
    if (!this.canvas) this.init();
    if (this.canvas) this.canvas.style.display = 'block';
    const dEl = document.getElementById('desktop');
    if (dEl) {
      dEl.style.backgroundImage = 'none';
      dEl.style.backgroundColor = '#07080f';
    }
    if (!this.stars.length) this.createStars();
    if (!this.animId) this.animate();
  },

  stop() {
    this.active = false;
    if (this.canvas) this.canvas.style.display = 'none';
    if (this.animId) {
      cancelAnimationFrame(this.animId);
      this.animId = null;
    }
  },

  addMeteor() {
    const w = this.canvas.width;
    const h = this.canvas.height;
    const startX = Math.random() * w * 0.8;
    const startY = Math.random() * h * 0.4;
    const length = Math.random() * 90 + 70;
    const speed = Math.random() * 7 + 9;
    this.meteors.push({
      x: startX,
      y: startY,
      length: length,
      speedX: speed,
      speedY: speed * 0.65,
      alpha: 1,
      fade: Math.random() * 0.018 + 0.012
    });
  },

  animate() {
    if (!this.active) return;
    const w = this.canvas.width;
    const h = this.canvas.height;
    const ctx = this.ctx;

    // Deep space gradient backdrop
    const grad = ctx.createLinearGradient(0, 0, w, h);
    grad.addColorStop(0, '#04050a');
    grad.addColorStop(0.5, '#070914');
    grad.addColorStop(1, '#05070e');
    ctx.fillStyle = grad;
    ctx.fillRect(0, 0, w, h);

    // Subtle cosmic nebula glow
    const neb = ctx.createRadialGradient(w * 0.35, h * 0.35, 10, w * 0.35, h * 0.35, w * 0.55);
    neb.addColorStop(0, 'rgba(56, 189, 248, 0.04)');
    neb.addColorStop(0.5, 'rgba(147, 51, 234, 0.03)');
    neb.addColorStop(1, 'transparent');
    ctx.fillStyle = neb;
    ctx.fillRect(0, 0, w, h);

    // Draw and move stars
    for (let i = 0; i < this.stars.length; i++) {
      const s = this.stars[i];
      s.x += s.speedX;
      s.y += s.speedY;

      // Wrap around edges smoothly
      if (s.x < 0) s.x = w;
      if (s.x > w) s.x = 0;
      if (s.y < 0) s.y = h;
      if (s.y > h) s.y = 0;

      s.twinklePhase += s.twinkleSpeed;
      const currentAlpha = Math.max(0.15, Math.min(1, s.alpha + Math.sin(s.twinklePhase) * 0.35));

      ctx.beginPath();
      ctx.arc(s.x, s.y, s.radius, 0, Math.PI * 2);
      ctx.fillStyle = s.color;
      ctx.globalAlpha = currentAlpha;
      ctx.fill();

      // Soft flare for larger stars
      if (s.radius > 1.4 && currentAlpha > 0.6) {
        ctx.beginPath();
        ctx.arc(s.x, s.y, s.radius * 2.2, 0, Math.PI * 2);
        ctx.fillStyle = 'rgba(255, 255, 255, 0.15)';
        ctx.fill();
      }
    }
    ctx.globalAlpha = 1;

    // Meteors
    const now = Date.now();
    if (now - this.lastMeteorTime > 14000) {
      this.lastMeteorTime = now;
      this.addMeteor();
    }

    for (let i = this.meteors.length - 1; i >= 0; i--) {
      const m = this.meteors[i];
      m.x += m.speedX;
      m.y += m.speedY;
      m.alpha -= m.fade;

      if (m.alpha <= 0 || m.x > w || m.y > h) {
        this.meteors.splice(i, 1);
        continue;
      }

      ctx.save();
      ctx.strokeStyle = `rgba(255, 255, 255, ${m.alpha})`;
      ctx.lineWidth = 1.6;
      ctx.beginPath();
      ctx.moveTo(m.x, m.y);
      ctx.lineTo(m.x - m.length, m.y - (m.length * 0.65));
      ctx.stroke();
      ctx.restore();
    }

    this.animId = requestAnimationFrame(() => this.animate());
  }
};

/* ================= AUTO-HIDE TITLEBAR & TASKBAR ON MAXIMIZE ================= */
const AutoHideController = {
  timer: null,
  isAutohidden: false,

  init() {
    window.addEventListener('pointermove', (e) => this.handlePointerMove(e), { passive: true });
    window.addEventListener('pointerdown', (e) => this.handlePointerDown(e), { passive: true });
    window.addEventListener('touchstart', (e) => {
      if (e.touches && e.touches[0]) {
        this.handlePointerDown(e.touches[0]);
      }
    }, { passive: true });

    // Edge trigger hints
    const topTrigger = document.getElementById('edge-trigger-top');
    const bottomTrigger = document.getElementById('edge-trigger-bottom');
    if (topTrigger) {
      topTrigger.addEventListener('mouseenter', () => { this.showBars(); this.resetTimer(); });
      topTrigger.addEventListener('touchstart', () => { this.showBars(); this.resetTimer(); }, { passive: true });
    }
    if (bottomTrigger) {
      bottomTrigger.addEventListener('mouseenter', () => { this.showBars(); this.resetTimer(); });
      bottomTrigger.addEventListener('touchstart', () => { this.showBars(); this.resetTimer(); }, { passive: true });
    }
  },

  onWindowMaximized(win) {
    this.showBars();
    this.resetTimer();
  },

  onWindowUnmaximized() {
    if (!this.hasMaximizedWindow()) {
      this.cancelTimer();
      this.showBars();
    } else {
      this.resetTimer();
    }
  },

  resetTimer() {
    if (!this.hasMaximizedWindow()) return;
    this.cancelTimer();
    this.timer = setTimeout(() => {
      this.hideBars();
    }, 4000); // 4 seconds inactivity
  },

  cancelTimer() {
    if (this.timer) {
      clearTimeout(this.timer);
      this.timer = null;
    }
  },

  hasMaximizedWindow() {
    let has = false;
    WindowManager.windows.forEach(w => {
      if (w.maximized && !w.minimized) has = true;
    });
    return has || document.fullscreenElement != null;
  },

  hideBars() {
    if (!this.hasMaximizedWindow()) return;
    this.isAutohidden = true;
    document.body.classList.add('autohide-active');
    const tb = document.getElementById('taskbar');
    if (tb) tb.classList.add('autohidden');
    WindowManager.windows.forEach(w => {
      if (w.maximized) {
        w.el.classList.add('autohidden-bar');
      }
    });
  },

  showBars() {
    this.isAutohidden = false;
    document.body.classList.remove('autohide-active');
    const tb = document.getElementById('taskbar');
    if (tb) tb.classList.remove('autohidden');
    WindowManager.windows.forEach(w => {
      w.el.classList.remove('autohidden-bar');
    });
  },

  handlePointerMove(e) {
    if (!this.hasMaximizedWindow()) return;
    const y = e.clientY;
    const isNearTop = y <= 32;
    const isNearBottom = y >= window.innerHeight - 36;

    if (this.isAutohidden) {
      if (isNearTop || isNearBottom) {
        this.showBars();
        this.resetTimer();
      }
    } else {
      this.resetTimer();
    }
  },

  handlePointerDown(e) {
    if (!this.hasMaximizedWindow()) return;
    const y = e.clientY;
    const isNearTop = y <= 48;
    const isNearBottom = y >= window.innerHeight - 54;

    if (this.isAutohidden) {
      if (isNearTop || isNearBottom) {
        this.showBars();
        this.resetTimer();
      }
    } else {
      this.resetTimer();
    }
  }
};

/* ================= MULTI-DEVICE SESSION PERSISTENCE & LAN SYNC ================= */
let isSyncingFromServer = false;
let sessionSyncTimeout = null;

function syncSessionState(partial) {
  if (isSyncingFromServer) return;
  if (sessionSyncTimeout) clearTimeout(sessionSyncTimeout);
  sessionSyncTimeout = setTimeout(() => {
    fetch('/api/session/state', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify(partial)
    }).catch(e => console.warn('Session sync failed', e));
  }, 400);
}

function initSessionSync() {
  fetch('/api/session/state')
    .then(r => r.json())
    .then(state => {
      applySessionState(state, true);
    })
    .catch(e => {
      console.warn('Initial session fetch error:', e);
      setWallpaper(currentWallpaper, false);
      if (WindowManager.windows.size === 0) {
        WindowManager.open('antigravity');
      }
    });

  try {
    const evtSource = new EventSource('/api/session/events');
    evtSource.onmessage = (e) => {
      if (!e.data) return;
      try {
        const state = JSON.parse(e.data);
        applySessionState(state, false);
      } catch (err) {
        console.error('SSE parse error', err);
      }
    };
  } catch (err) {
    console.warn('SSE not supported or failed', err);
  }
}

function applySessionState(state, isInitialLoad = false) {
  if (!state) return;
  isSyncingFromServer = true;

  try {
    // Wallpaper & Live Wallpaper Sync
    if (state.is_live_wallpaper) {
      if (!LiveSpaceWallpaper.active) {
        LiveSpaceWallpaper.start();
      }
    } else if (state.wallpaper) {
      if (LiveSpaceWallpaper.active) {
        LiveSpaceWallpaper.stop();
      }
      if (state.wallpaper !== currentWallpaper || isInitialLoad) {
        setWallpaper(state.wallpaper, false);
      }
    }

    // Windows Sync on Initial Load across devices (e.g. tablet to phone)
    if (isInitialLoad) {
      if (WindowManager.windows.size === 0) {
        if (state.windows && state.windows.length > 0) {
          state.windows.forEach(w => {
            let appData = w.data;
            if (w.appId === 'antigravity' && state.antigravity) {
              appData = Object.assign({}, appData, state.antigravity);
            } else if (w.appId === 'notepad' && state.notepad && state.notepad.path) {
              appData = Object.assign({}, appData, state.notepad);
            }
            const winObj = WindowManager.open(w.appId, appData);
            if (winObj && w.maximized && !winObj.maximized) {
              WindowManager.toggleMaximize(winObj.id);
            }
          });
        } else {
          // Default start with Antigravity
          WindowManager.open('antigravity');
        }
      }
    }
  } finally {
    isSyncingFromServer = false;
  }
}

/* ================= DESKTOP & SHELL CONTROLS ================= */
async function loadDesktopIcons() {
  const desktopIconsEl = document.getElementById('desktop-icons');
  if (!desktopIconsEl) return;
  desktopIconsEl.innerHTML = '';

  // 1. Render Pinned System Apps
  APPS.forEach(app => {
    const iconEl = document.createElement('div');
    iconEl.className = 'desktop-icon';
    iconEl.innerHTML = `${app.icon}<span>${app.name}</span>`;
    iconEl.onclick = (e) => {
      desktopIconsEl.querySelectorAll('.desktop-icon').forEach(i => i.classList.remove('selected'));
      iconEl.classList.add('selected');
    };
    iconEl.ondblclick = () => app.open();
    desktopIconsEl.appendChild(iconEl);
  });

  // 2. Fetch Actual Files and Folders from ~/Desktop
  try {
    const res = await fetch('/api/list?share=Desktop&path=');
    if (res.ok) {
      const items = await res.json();
      items.forEach(item => {
        // Skip hidden files
        if (item.name.startsWith('.')) return;

        const iconEl = document.createElement('div');
        iconEl.className = 'desktop-icon';

        const isImg = !item.directory && /\.(png|jpe?g|svg|webp|gif|bmp|ico|avif)$/i.test(item.name);
        const isCode = !item.directory && /\.(py|sh|js|json|html|css|md|txt|yml|c|cpp|go|rs|env)$/i.test(item.name);

        let iconHtml = ICONS.file;
        if (item.directory) iconHtml = ICONS.folder;
        else if (isImg) iconHtml = `<img src="/view/Desktop/${encodeURIComponent(item.path)}" style="width:38px;height:38px;object-fit:cover;border-radius:4px" loading="lazy">`;
        else if (isCode) iconHtml = ICONS.code;

        iconEl.innerHTML = `${iconHtml}<span>${escapeHtml(item.name)}</span>`;

        iconEl.onclick = (e) => {
          if (Date.now() < suppressClickUntil) return;
          desktopIconsEl.querySelectorAll('.desktop-icon').forEach(i => i.classList.remove('selected'));
          iconEl.classList.add('selected');
        };

        iconEl.ondblclick = () => openDesktopItem(item);

        // Long Press & Right Click Context Menu on this file/folder
        setupLongPressAndContextMenu(iconEl, (x, y) => {
          showDesktopItemContextMenu(item, x, y);
        });

        desktopIconsEl.appendChild(iconEl);
      });
    }
  } catch (e) {
    console.error('Error loading desktop items:', e);
  }
}

function openDesktopItem(item) {
  if (item.directory) {
    WindowManager.open('explorer');
    setTimeout(() => {
      const wins = Array.from(WindowManager.windows.values()).filter(w => w.appId === 'explorer');
      if (wins.length) {
        AppExplorer.navigate(wins[wins.length - 1], 'Desktop', item.path);
      }
    }, 120);
  } else {
    const isWebpage = /\.(html?|xhtml)$/i.test(item.name);
    const isTextEditor = /\.(txt|py|sh|json|js|md|css|yml|conf|log|xml|c|h|cpp|env|ini|toml|bash|sql)$/i.test(item.name);

    if (isWebpage) {
      openInNewPage('Desktop', item.path);
    } else if (isTextEditor) {
      WindowManager.open('notepad', { share: 'Desktop', path: item.path, name: item.name });
    } else {
      // Images, PDFs, media, and other files open in another page / tab without downloading
      openInNewPage('Desktop', item.path);
    }
  }
}

  const isImg = !item.directory && /\.(png|jpe?g|svg|webp|gif|bmp|ico|avif)$/i.test(item.name);

      label: '🤖 Ask Antigravity Here',
      action: () => WindowManager.open('antigravity', { cwd: `/home/genius/Desktop/${item.path}` })
    });
  } else if (isWebpage) {
    menuItems.push({
      label: '🌐 Open Webpage (New Tab)',
      action: () => openInNewPage('Desktop', item.path)
    });
    menuItems.push({
      label: '📝 Edit in Notepad',
      action: () => WindowManager.open('notepad', { share: 'Desktop', path: item.path, name: item.name })
    });
  } else if (isImg) {
    menuItems.push({
      label: '🖼️ Open Image (New Tab)',
      action: () => openInNewPage('Desktop', item.path)
    });
    menuItems.push({
      label: '🎨 Set as Desktop Wallpaper',
      action: () => {
        setWallpaper(`/view/Desktop/${encodeURIComponent(item.path)}`);
        showToast('Wallpaper applied!');
      }
    });
  } else if (isPdf) {
    menuItems.push({
      label: '📄 Open PDF (New Tab)',
      action: () => openInNewPage('Desktop', item.path)
    });
  } else if (isText) {
    menuItems.push({
      label: '📝 Open in Notepad',
      action: () => WindowManager.open('notepad', { share: 'Desktop', path: item.path, name: item.name })
    });
    menuItems.push({
      label: '🌐 Open in New Tab',
      action: () => openInNewPage('Desktop', item.path)
    });
  } else {
    menuItems.push({
      label: '🌐 Open in New Tab',
      action: () => openInNewPage('Desktop', item.path)
    });
  }

  if (!item.directory) {
    menuItems.push({
      label: '📥 Download file',

    });
  }

  menuItems.push({
    label: '✏️ Rename',

        }).then(r => {

function initDesktop() {
  // Initialize Live Space Wallpaper & Auto-Hide Controller
  LiveSpaceWallpaper.init();
  AutoHideController.init();

  // Initialize LAN Multi-Device Session Persistence & Sync
  initSessionSync();

  // Render Pinned Apps & Actual Desktop Files
  loadDesktopIcons();

  // Render Start Menu Apps Grid
  const startGridEl = document.getElementById('start-apps-grid');
  startGridEl.innerHTML = '';
  APPS.forEach(app => {
    const item = document.createElement('div');
    item.className = 'start-app-item';
    item.innerHTML = `
      ${app.icon}
      <div class="start-app-info">
        <div class="start-app-name">${app.name}</div>
        <div class="start-app-desc">${app.desc}</div>
      </div>
    `;
    item.onclick = () => {
      toggleStartMenu(false);
      app.open();
    };
    startGridEl.appendChild(item);
  });

  // Update Clock
  updateClock();
  setInterval(updateClock, 1000);

  // Fetch System Stats periodically
  fetchStats();
  setInterval(fetchStats, 3000);

  // Desktop Wallpaper Right-Click & Touch Long-Press Context Menu
  const desktopEl = document.getElementById('desktop');
  setupLongPressAndContextMenu(desktopEl, (x, y) => {
    showDesktopEmptyContextMenu(x, y);
  });

  // Close context menu & start menu on global click
  document.addEventListener('click', (e) => {
    if (!e.target.closest('#ctx-menu')) hideContextMenu();
    if (!e.target.closest('#start-menu') && !e.target.closest('#start-btn')) toggleStartMenu(false);
  });
}

function updateClock() {
  const d = new Date();
  const timeStr = d.toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' });
  const dateStr = d.toLocaleDateString([], { day: '2-digit', month: '2-digit', year: 'numeric' });
  const timeEl = document.getElementById('tray-time');
  const dateEl = document.getElementById('tray-date');
  if (timeEl) timeEl.textContent = timeStr;
  if (dateEl) dateEl.textContent = dateStr;
}

function fetchStats() {
  fetch('/api/system/stats')
    .then(r => r.json())
    .then(data => {
      systemStats = data;
      // Update taskbar battery
      const batEl = document.getElementById('tray-bat-text');
      if (batEl && data.battery) {
        batEl.textContent = `${data.battery.capacity}%`;
      }
      // Update start menu banner
      const hostEl = document.getElementById('banner-host');
      const ipEl = document.getElementById('banner-ip');
      const cpuEl = document.getElementById('banner-cpu');
      const ramEl = document.getElementById('banner-ram');
      if (hostEl) hostEl.textContent = data.hostname;
      if (ipEl) ipEl.textContent = `${location.host}`;
      if (cpuEl) cpuEl.textContent = `CPU: ${data.cpu_percent}%`;
      if (ramEl && data.memory) ramEl.textContent = `RAM: ${data.memory.percent}%`;
    })
    .catch(() => {});
}

function toggleStartMenu(forceState) {
  const menu = document.getElementById('start-menu');
  const isOpen = menu.classList.contains('open');
  const next = forceState !== undefined ? forceState : !isOpen;
  if (next) {
    menu.classList.add('open');
    document.getElementById('start-search-input').focus();
  } else {
    menu.classList.remove('open');
  }
}

function filterStartMenu(query) {
  const q = query.toLowerCase();
  document.querySelectorAll('.start-app-item').forEach(item => {
    const name = item.querySelector('.start-app-name').textContent.toLowerCase();
    const desc = item.querySelector('.start-app-desc').textContent.toLowerCase();
    item.style.display = (name.includes(q) || desc.includes(q)) ? 'flex' : 'none';
  });
}

function toggleFullscreen() {
  if (!document.fullscreenElement) {
    document.documentElement.requestFullscreen().catch(()=>{});
  } else {
    document.exitFullscreen().catch(()=>{});
  }
}

function minimizeAllWindows() {
  const allMinimized = Array.from(WindowManager.windows.values()).every(w => w.minimized);
  WindowManager.windows.forEach(w => {
    if (allMinimized) WindowManager.restore(w.id);
    else WindowManager.minimize(w.id);
  });
}

function showContextMenuAt(x, y, items) {
  const menu = document.getElementById('ctx-menu');
  menu.innerHTML = '';
  items.forEach(it => {
    if (it.separator) {
      menu.appendChild(document.createElement('hr')).className = 'win-ctx-sep';
    } else {
      const btn = document.createElement('button');
      btn.className = 'win-ctx-item' + (it.danger ? ' danger' : '');
      btn.textContent = it.label;
      btn.onclick = () => {
        hideContextMenu();
        it.action();
      };
      menu.appendChild(btn);
    }
  });

  menu.style.display = 'block';
  const mw = menu.offsetWidth, mh = menu.offsetHeight;
  menu.style.left = Math.min(x, window.innerWidth - mw - 10) + 'px';
  menu.style.top = Math.min(y, window.innerHeight - mh - 10) + 'px';
}

function hideContextMenu() {
  document.getElementById('ctx-menu').style.display = 'none';
}

function showToast(text) {
  const t = document.getElementById('win-toast');
  document.getElementById('toast-text').textContent = text;
  t.classList.add('show');
  clearTimeout(showToast._timer);
  showToast._timer = setTimeout(() => t.classList.remove('show'), 3000);
}

function formatBytes(bytes) {
  if (!bytes || bytes === 0) return '0 B';
  const k = 1024;
  const sizes = ['B', 'KB', 'MB', 'GB', 'TB'];
  const i = Math.floor(Math.log(bytes) / Math.log(k));
  return parseFloat((bytes / Math.pow(k, i)).toFixed(1)) + ' ' + sizes[i];
}

function escapeHtml(str) {
  return (str || '').replace(/[&<>"']/g, m => ({
    '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;'
  })[m]);
}

window.addEventListener('DOMContentLoaded', initDesktop);
</script>
